<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel — Tudo Sobre o Crime</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0d0f;color:#eee;font-family:Arial,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px 50px}.brand{font-size:26px;font-weight:800;margin-bottom:22px}.brand span{color:#d7ad55}.card{background:#171719;border:1px solid #303035;border-radius:14px;padding:18px;margin-bottom:16px}h2{font-size:18px;margin:0 0 14px}label{display:block;font-weight:700;margin:14px 0 7px}input,select,button{width:100%;border:1px solid #3b3b40;border-radius:10px;background:#0f0f11;color:#fff;padding:13px;font-size:16px}input[type=file]{padding:11px}button{background:#d5ad57;color:#111;font-weight:800;border:0;margin-top:15px;cursor:pointer}button:disabled{opacity:.45}.preview{display:none;margin-top:15px}.preview img{display:block;max-width:100%;max-height:360px;margin:auto;border-radius:10px}.muted{color:#aaa;font-size:14px;line-height:1.5}.status{margin-top:14px;padding:13px;border-radius:10px;background:#0b0b0c;white-space:pre-wrap;word-break:break-word}.ok{color:#70e090}.err{color:#ff7777}.url{font-size:13px;word-break:break-all}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="brand">Tudo Sobre <span>o Crime</span></div>
<div class="card">
<h2>Configuração</h2>
<label for="token">Token do GitHub</label>
<input id="token" type="password" placeholder="Cole o token uma vez">
<button id="saveToken">Salvar token neste dispositivo</button>
<p class="muted">O token fica salvo somente no armazenamento local deste navegador. Não é enviado para outro servidor.</p>
</div>
<div class="card">
<h2>Enviar imagem</h2>
<label for="post">Post</label>
<select id="post"><option>Carregando posts...</option></select>
<p class="muted">O post escolhido determina a qual caso esta imagem pertence. A posição dentro do texto será definida depois.</p>
<div class="row">
<div><label for="filename">Nome da imagem</label><input id="filename" placeholder="ex.: cena-casa-bundy"></div>
<div><label for="file">Imagem</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"></div>
</div>
<div class="preview" id="preview"><img id="previewImg"><p class="muted" id="info"></p></div>
<button id="upload" disabled>Converter para WebP e enviar</button>
<div class="status" id="status">Aguardando imagem.</div>
</div>
</main>
<script>
const OWNER='sites84',REPO='Tudo-sobre-o-crime',BRANCH='main';
const $=id=>document.getElementById(id);
const token=$('token'),post=$('post'),file=$('file'),filename=$('filename'),preview=$('preview'),previewImg=$('previewImg'),info=$('info'),upload=$('upload'),status=$('status');
const saved=localStorage.getItem('tsoc_github_token');if(saved)token.value=saved;
$('saveToken').onclick=()=>{const v=token.value.trim();if(!v)return setStatus('Informe o token do GitHub.','err');localStorage.setItem('tsoc_github_token',v);setStatus('Token salvo neste dispositivo.','ok')};
function setStatus(t,c=''){status.textContent=t;status.className='status '+c}
async function api(url,opts={}){const t=token.value.trim()||localStorage.getItem('tsoc_github_token');if(!t)throw Error('Token do GitHub não informado.');const r=await fetch(url,{...opts,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.message||('GitHub HTTP '+r.status));return data}
async function loadPosts(){try{const data=await api(`https://api.github.com/repos/${OWNER}/${REPO}/contents/casos?ref=${BRANCH}`);post.innerHTML='';data.filter(x=>x.type==='file'&&x.name.endsWith('.html')).forEach(x=>{const o=document.createElement('option');o.value=x.name;o.textContent=x.name.replace(/\.html$/,'').replace(/[-_]/g,' ');post.appendChild(o)});if(!post.options.length)post.innerHTML='<option value="">Nenhum post encontrado</option>'}catch(e){post.innerHTML='<option value="">Não foi possível carregar os posts</option>';setStatus('Erro ao carregar posts: '+e.message,'err')}}
file.onchange=()=>{const f=file.files[0];if(!f){upload.disabled=true;return}preview.style.display='block';previewImg.src=URL.createObjectURL(f);info.textContent=`Original: ${f.name} — ${(f.size/1024/1024).toFixed(2)} MB`;if(!filename.value)filename.value=f.name.replace(/\.[^.]+$/,'').replace(/[^a-zA-Z0-9_-]+/g,'-').toLowerCase();upload.disabled=false;setStatus('Imagem pronta para conversão.','')};
function canvasWebp(f){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d');x.drawImage(img,0,0);c.toBlob(b=>b?resolve(b):reject(Error('O navegador não conseguiu gerar WebP.')),'image/webp',0.88)};img.onerror=()=>reject(Error('Não foi possível ler a imagem.'));img.src=URL.createObjectURL(f)})}
function base64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)})}
upload.onclick=async()=>{try{upload.disabled=true;setStatus('Convertendo para WebP...');const f=file.files[0];if(!f)throw Error('Escolha uma imagem.');const clean=(filename.value.trim()||f.name.replace(/\.[^.]+$/,'')).replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').toLowerCase();if(!clean)throw Error('Informe um nome válido.');const blob=await canvasWebp(f);const b64=await base64(blob);const path=`assets/${clean}.webp`;setStatus(`Enviando ${path}...`);let sha=null;try{const old=await api(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`);sha=old.sha}catch(e){}const body={message:`Adicionar imagem ${clean}.webp`,content:b64,branch:BRANCH};if(sha)body.sha=sha;const result=await api(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{method:'PUT',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});const url=`https://${OWNER}.github.io/${REPO}/${path}`;setStatus(`ENVIADO COM SUCESSO\n\nPost selecionado: ${post.options[post.selectedIndex]?.textContent||''}\nArquivo: ${path}\nTamanho WebP: ${(blob.size/1024/1024).toFixed(2)} MB\n\nURL:\n${url}\n\nCommit: ${result.commit?.sha||'concluído'}`,'ok');}catch(e){setStatus('ERRO\n\n'+e.message,'err')}finally{upload.disabled=false}};
loadPosts();
</script>
</body></html>
