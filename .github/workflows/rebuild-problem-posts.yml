name: Rebuild problem posts
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.event.head_commit.message == 'TRIGGER REBUILD DAHMER BUNDY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild posts
        shell: python
        run: |
          from pathlib import Path
          import re
          posts=[('casos/jeffrey-dahmer.html','casos/jeffrey-dahmer-rebuilt.html','Jeffrey Dahmer: o caso de Milwaukee (Estados Unidos, 1978–1991)','capa-jeffrey-dahmer.webp'),('casos/ted-bundy.html','casos/ted-bundy-rebuilt.html','Ted Bundy: o caso','capa-ted-bundy.webp')]
          for old,new,title,cover in posts:
            src=Path(old).read_text(encoding='utf-8')
            m=re.search(r'<article\b[^>]*id=["\']article-content["\'][^>]*>(.*?)</article>',src,re.I|re.S) or re.search(r'<article\b[^>]*>(.*?)</article>',src,re.I|re.S)
            if not m: raise SystemExit(f'Não foi possível extrair {old}')
            article=m.group(1).strip()
            clean=f'''<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{title} | Tudo Sobre o Crime</title><meta name="description" content="{title}"><meta property="og:title" content="{title}"><meta property="og:description" content="{title}"><meta property="og:image" content="https://sites84.github.io/Tudo-sobre-o-crime/casos/{cover}"><link rel="stylesheet" href="../style.css"></head><body><header class="site-header"><nav class="nav"><a class="brand" href="../">Tudo Sobre o Crime</a><a class="back" href="../">Todos os casos</a></nav></header><div class="hero"><img src="{cover}" alt="Ilustração de capa do caso"></div><main class="container"><section class="article-head"><h1>{title}</h1><button class="share" data-share type="button">↗ Compartilhar</button></section><article class="article" id="article-content">{article}</article></main></body></html>'''
            Path(new).write_text(clean,encoding='utf-8')
          for old,new,*_ in posts:
            Path(old).unlink(); Path(new).rename(old)
      - name: Commit rebuilt posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casos/jeffrey-dahmer.html casos/ted-bundy.html
          git commit -m "Reconstrói posts Dahmer e Bundy do zero" || exit 0
          git push
